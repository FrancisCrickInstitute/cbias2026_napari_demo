name: cbias2026-plugin
display_name: CBIAS2026 Demo Plugin
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
# categories: []
contributions:
  commands:
    - id: cbias2026-plugin.get_reader
      python_name: cbias2026_plugin._reader:napari_get_reader
      title: Open data with CBIAS2026 Demo Plugin
    - id: cbias2026-plugin.write_multiple
      python_name: cbias2026_plugin._writer:write_multiple
      title: Save multi-layer data with CBIAS2026 Demo Plugin
    - id: cbias2026-plugin.write_single_image
      python_name: cbias2026_plugin._writer:write_single_image
      title: Save image data with CBIAS2026 Demo Plugin
    - id: cbias2026-plugin.make_sample_data
      python_name: cbias2026_plugin._sample_data:make_sample_data
      title: Load sample data from CBIAS2026 Demo Plugin
    - id: cbias2026-plugin.make_container_widget
      python_name: cbias2026_plugin._widget:ImageThreshold
      title: Make threshold Container widget
    - id: cbias2026-plugin.make_magic_widget
      python_name: cbias2026_plugin._widget:threshold_magic_widget
      title: Make threshold magic widget
    - id: cbias2026-plugin.make_function_widget
      python_name: cbias2026_plugin._widget:threshold_autogenerate_widget
      title: Make threshold function widget
    - id: cbias2026-plugin.make_qwidget
      python_name: cbias2026_plugin._widget:ExampleQWidget
      title: Make example QWidget
  readers:
    - command: cbias2026-plugin.get_reader
      accepts_directories: false
      filename_patterns: ['*.npy']
  writers:
    - command: cbias2026-plugin.write_multiple
      layer_types: ['image*','labels*']
      filename_extensions: []
    - command: cbias2026-plugin.write_single_image
      layer_types: ['image']
      filename_extensions: ['.npy']
  sample_data:
    - command: cbias2026-plugin.make_sample_data
      display_name: CBIAS2026 Demo Plugin
      key: unique_id.1
  widgets:
    - command: cbias2026-plugin.make_container_widget
      display_name: Container Threshold
    - command: cbias2026-plugin.make_magic_widget
      display_name: Magic Threshold
    - command: cbias2026-plugin.make_function_widget
      autogenerate: true
      display_name: Autogenerate Threshold
    - command: cbias2026-plugin.make_qwidget
      display_name: Example QWidget
  menus:
    napari/layers/segment:
      - command: cbias2026-plugin.make_container_widget
      - command: cbias2026-plugin.make_magic_widget
      - command: cbias2026-plugin.make_function_widget
      - command: cbias2026-plugin.make_qwidget
