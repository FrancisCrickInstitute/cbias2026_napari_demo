name: cbias2026-plugin
display_name: CBIAS2026 Demo Plugin
# use 'hidden' to remove plugin from napari hub search results
visibility: hidden
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
# categories: []
contributions:
  commands:
    - id: cbias2026-plugin.get_reader
      python_name: cbias2026_plugin._reader:napari_get_reader
      title: Open data with CBIAS2026 Demo Plugin
    - id: cbias2026-plugin.write_single_image
      python_name: cbias2026_plugin._writer:write_single_image
      title: Save image data with CBIAS2026 Demo Plugin
    - id: cbias2026-plugin.write_labels_features
      python_name: cbias2026_plugin._writer:write_labels_features
      title: Save object measurements with CBIAS2026 Demo Plugin
    - id: cbias2026-plugin.make_sample_data
      python_name: cbias2026_plugin._sample_data:make_sample_data
      title: Load sample data from CBIAS2026 Demo Plugin
    - id: cbias2026-plugin.make_function_widget
      python_name: cbias2026_plugin._widget:threshold_autogenerate_widget
      title: Make threshold autogenerated function widget
    - id: cbias2026-plugin.make_factory_widget
      python_name: cbias2026_plugin._widget:threshold_factory_widget
      title: Make threshold magic_factory widget
    - id: cbias2026-plugin.make_live_widget
      python_name: cbias2026_plugin._widget:threshold_live_widget
      title: Make live threshold magic_factory widget
    - id: cbias2026-plugin.make_container_widget
      python_name: cbias2026_plugin._widget:ImageThreshold
      title: Make threshold Container widget
    - id: cbias2026-plugin.make_qwidget
      python_name: cbias2026_plugin._widget:ThresholdQWidget
      title: Make threshold QWidget widget
    - id: cbias2026-plugin.make_workflow_widget
      python_name: cbias2026_plugin._workflow:ExampleWorkflowWidget
      title: Make example workflow widget
    - id: cbias2026-plugin.segment_image
      python_name: cbias2026_plugin._segment:segment_image
      title: Segment image (Gaussian + Otsu)
      # greys out the menu entry unless an Image layer is selected
      enablement: active_layer_type == 'image'
  readers:
    - command: cbias2026-plugin.get_reader
      accepts_directories: false
      filename_patterns: ['*.npy']
  writers:
    - command: cbias2026-plugin.write_single_image
      layer_types: ['image']
      filename_extensions: ['.npy']
    - command: cbias2026-plugin.write_labels_features
      display_name: Object measurements
      layer_types: ['labels']
      filename_extensions: ['.csv']
  sample_data:
    - command: cbias2026-plugin.make_sample_data
      display_name: CBIAS2026 Demo Plugin
      key: unique_id.1
  widgets:
    - command: cbias2026-plugin.make_function_widget
      autogenerate: true
      display_name: Threshold (autogenerate)
    - command: cbias2026-plugin.make_factory_widget
      display_name: Threshold (magic_factory)
    - command: cbias2026-plugin.make_live_widget
      display_name: Threshold (magic_factory, live)
    - command: cbias2026-plugin.make_container_widget
      display_name: Threshold (Container)
    - command: cbias2026-plugin.make_qwidget
      display_name: Threshold (QWidget)
    - command: cbias2026-plugin.make_workflow_widget
      display_name: Example Workflow Widget
  menus:
    napari/layers/segment:
      - submenu: cbias2026-plugin.demo_menu
    cbias2026-plugin.demo_menu:
      - command: cbias2026-plugin.segment_image
      - command: cbias2026-plugin.make_function_widget
      - command: cbias2026-plugin.make_factory_widget
      - command: cbias2026-plugin.make_live_widget
      - command: cbias2026-plugin.make_container_widget
      - command: cbias2026-plugin.make_qwidget
    napari/layers/measure:
      - command: cbias2026-plugin.make_workflow_widget
  submenus:
    - id: cbias2026-plugin.demo_menu
      label: CBIAS demo
  configurations:
    segmentation:
      title: Segmentation
      properties:
        sigma:
          title: Gaussian smoothing sigma (pixels)
          type: float
          default: 5.0
          minimum: 0.5
          maximum: 50.0
          description: Larger values merge nearby objects and smooth edges.
        threshold_method:
          title: Threshold method
          type: string
          default: otsu
          enum: [otsu, li, triangle]
          description: scikit-image method used to pick the threshold.
        min_area:
          title: Minimum object area (pixels)
          type: integer
          default: 0
          minimum: 0
          description: Objects smaller than this are removed.
