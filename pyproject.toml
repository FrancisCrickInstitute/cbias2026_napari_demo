[project]
name = "cbias2026-plugin"
dynamic = ["version"]
description = "Demo plugin for the CBIAS 2026 napari workshop"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Cameron Shand"},
  {email = "cameron.shand@crick.ac.uk"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: napari",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.13"
# napari can be included in dependencies if napari imports are required.
# However, you should not include napari[all], napari[qt],
# or any other Qt bindings directly (e.g. PyQt5, PySide2).
# See best practices: https://napari.org/stable/plugins/building_a_plugin/best_practices.html
dependencies = [
    "napari>=0.10",
    "numpy",
    "magicgui",
    "qtpy",
    "scikit-image",
    "pandas",
    # the minimum pandas accepts for DataFrame.to_markdown
    "tabulate>=0.9",
    "imagecodecs",
]

[project.optional-dependencies]
# Allow easily installation with the full, default napari installation
# (including Qt backend) using cbias2026-plugin[all].
all = [
    "napari[all]",
    # Qt 6.12 hides magicgui's slider value readout (the text box collapses
    # to 1 px). Remove once https://github.com/pyapp-kit/magicgui/pull/751
    # is released.
    "PyQt6<6.12",
]

[dependency-groups]
dev = [
    "tox-uv",
    "pytest",  # https://docs.pytest.org/en/latest/contents.html
    "pytest-cov",  # https://pytest-cov.readthedocs.io/en/latest/
    "prek",  # fast drop-in replacement for pre-commit
    "pytest-qt",  # https://pytest-qt.readthedocs.io/en/latest/
    "napari[qt]",  # test with napari's default Qt bindings
    "PyQt6<6.12",  # see the note on the `all` extra
]

[project.entry-points."napari.manifest"]
cbias2026-plugin = "cbias2026_plugin:napari.yaml"



[build-system]
requires = ["setuptools>=77.0.3", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.uv]
# A fixed cutoff, so that uv.lock is valid on every machine and `uv sync`
# gives everyone the same versions. Without it, uv re-resolves whenever its
# exclude-newer setting differs from the one the lock was made with. Move
# the date forward (then run `uv lock`) to pick up newer packages.
exclude-newer = "2026-11-16T00:00:00Z"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.setuptools_scm]
write_to = "src/cbias2026_plugin/_version.py"
fallback_version = "0.0.1+nogit"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
# filterwarnings = ["error"]  # recommended by PP309; deprecation warnings cause failures so leaving for the user to enable if desired
log_cli_level = "INFO"
testpaths = ["tests"]

[tool.ruff]
line-length = 79
fix = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long. handled by formatter
    "UP006", "UP007", # type annotation. As using magicgui require runtime type annotation then we disable this.
]
